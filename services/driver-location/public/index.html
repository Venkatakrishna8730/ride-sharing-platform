<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Driver Fleet Tracking</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #111827;
      color: #f3f4f6;
    }
    header {
      background: #1f2937;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #374151;
      z-index: 1000;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: -0.02em;
    }
    .badge {
      font-size: 0.75rem;
      background: #0284c7;
      color: white;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .stats-bar {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 0.85rem;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .stat-label {
      color: #9ca3af;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-value {
      font-weight: 700;
      font-size: 1.05rem;
      color: #10b981;
    }
    #map {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #0f172a;
    }
    .driver-marker {
      background: #38bdf8;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
      transition: transform 0.3s ease-out;
    }
    .driver-marker.offline {
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
    }
    .leaflet-popup-content-wrapper {
      background: #1f2937;
      color: #f3f4f6;
      border: 1px solid #374151;
      border-radius: 8px;
    }
    .leaflet-popup-tip {
      background: #1f2937;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Ride Platform &bull; Driver Fleet Tracking</h1>
      <span class="badge">Stage 2 Live</span>
    </div>
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">Active Nearby Drivers</span>
        <span class="stat-value" id="stat-active-count">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Query Latency</span>
        <span class="stat-value" id="stat-latency">0 ms</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Search Radius</span>
        <span class="stat-value">15 km</span>
      </div>
    </div>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Default location: Bangalore City Center (12.9716° N, 77.5946° E)
    const CENTER_LAT = 12.9716;
    const CENTER_LON = 77.5946;

    const map = L.map('map').setView([CENTER_LAT, CENTER_LON], 13);

    // Dark tile layer for modern telemetry dashboard look
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    // Center marker
    const centerIcon = L.circleMarker([CENTER_LAT, CENTER_LON], {
      radius: 8,
      fillColor: '#ef4444',
      color: '#ffffff',
      weight: 2,
      opacity: 1,
      fillOpacity: 0.9
    }).addTo(map);
    centerIcon.bindPopup('<b>Query Center Point</b><br>Lat: 12.9716, Lon: 77.5946');

    // Radius circle (15km)
    L.circle([CENTER_LAT, CENTER_LON], {
      radius: 15000,
      color: '#38bdf8',
      weight: 1,
      dashArray: '4, 8',
      fillOpacity: 0.03
    }).addTo(map);

    const driverMarkers = new Map(); // driverId -> Leaflet marker

    async function pollNearbyDrivers() {
      const startTime = performance.now();
      try {
        const response = await fetch(`/api/v1/drivers/nearby?latitude=${CENTER_LAT}&longitude=${CENTER_LON}&radiusKm=15&limit=2000`);
        const duration = Math.round(performance.now() - startTime);

        if (!response.ok) return;

        const data = await response.json();
        document.getElementById('stat-active-count').textContent = data.count || 0;
        document.getElementById('stat-latency').textContent = `${data.queryExecutionTimeMs || duration} ms`;

        const activeIds = new Set();

        (data.drivers || []).forEach(driver => {
          activeIds.add(driver.driverId);
          const lat = driver.latitude;
          const lon = driver.longitude;

          if (driverMarkers.has(driver.driverId)) {
            // Update marker position
            const marker = driverMarkers.get(driver.driverId);
            marker.setLatLng([lat, lon]);
            marker.getPopup().setContent(`
              <b>Driver:</b> ${driver.driverId}<br>
              <b>Status:</b> ${driver.status}<br>
              <b>Speed:</b> ${driver.speed} km/h<br>
              <b>Bearing:</b> ${driver.bearing}&deg;<br>
              <b>Distance:</b> ${driver.distanceKm} km
            `);
          } else {
            // Create car icon marker
            const marker = L.circleMarker([lat, lon], {
              radius: 6,
              fillColor: '#0ea5e9',
              color: '#ffffff',
              weight: 1.5,
              opacity: 1,
              fillOpacity: 0.85
            }).addTo(map);

            marker.bindPopup(`
              <b>Driver:</b> ${driver.driverId}<br>
              <b>Status:</b> ${driver.status}<br>
              <b>Speed:</b> ${driver.speed} km/h<br>
              <b>Bearing:</b> ${driver.bearing}&deg;<br>
              <b>Distance:</b> ${driver.distanceKm} km
            `);

            driverMarkers.set(driver.driverId, marker);
          }
        });

        // Remove markers that are no longer in active query (TTL expired / vanished)
        for (const [id, marker] of driverMarkers.entries()) {
          if (!activeIds.has(id)) {
            map.removeLayer(marker);
            driverMarkers.delete(id);
          }
        }
      } catch (err) {
        console.error('Polling error:', err);
      }
    }

    // Poll every 1 second
    setInterval(pollNearbyDrivers, 1000);
    pollNearbyDrivers();
  </script>
</body>
</html>
