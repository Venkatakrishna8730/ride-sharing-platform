apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-location-service
  namespace: ride-platform
  labels:
    app.kubernetes.io/name: driver-location-service
    app.kubernetes.io/component: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: driver-location-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: driver-location-service
        app.kubernetes.io/component: telemetry
    spec:
      containers:
        - name: driver-location
          image: ride-platform/driver-location:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: PORT
              value: "8081"
            - name: REDIS_URL
              value: "redis://redis.ride-platform.svc.cluster.local:6379"
            - name: JWT_SECRET
              value: "dGhpcy1pcy1hLXNlY3VyZS0yNTYtYml0LXNlY3JldC1rZXktZm9yLXJpZGUtc2hhcmluZy1wbGF0Zm9ybQ=="
            - name: PRESENCE_TTL_SEC
              value: "10"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: driver-location-service
  namespace: ride-platform
  labels:
    app.kubernetes.io/name: driver-location-service
    app.kubernetes.io/component: telemetry
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  selector:
    app.kubernetes.io/name: driver-location-service
