apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: ride-platform
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: message-broker
spec:
  clusterIP: None
  ports:
    - port: 9092
      name: client
    - port: 9093
      name: controller
  selector:
    app.kubernetes.io/name: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ride-platform
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: message-broker
spec:
  type: ClusterIP
  ports:
    - port: 9092
      targetPort: 9092
      name: client
  selector:
    app.kubernetes.io/name: kafka
